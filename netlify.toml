[build]
  command = "node build.js"
  publish = "."

# Media statici: cache lunga (non cambiano mai senza cambiare nome file)
[[headers]]
  for = "/assets/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS del sito: cambiano a ogni deploy -> sempre rivalidati (ETag = 304 veloci)
[[headers]]
  for = "/assets/site.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/site.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Informativa privacy e cookie (pagina del CMS in content/pagine/privacy.md)
[[redirects]]
  from = "/privacy"
  to = "/pagine/privacy"
  status = 301

[[headers]]
  for = "/assets/consent.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/tokens.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
